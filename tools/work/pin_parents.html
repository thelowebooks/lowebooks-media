<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
.frame{width:1000px;height:1500px;background:var(--teal);color:var(--cream);padding:96px 84px;display:flex;flex-direction:column;justify-content:space-between}
.top{font-size:26px}
h1{font-size:122px;margin:0 0 56px}
.card{padding:58px 56px;display:flex;flex-direction:column;gap:22px;transform:rotate(-1.5deg)}
.card .label{font-size:24px;color:var(--teal)}
.card .display{font-size:68px;line-height:1.08}
.foot{display:flex;flex-direction:column;gap:10px}
.foot .from{font-size:32px;font-weight:500}
.foot .title{font-size:44px}
.foot .tag{font-size:30px;font-weight:700;color:var(--yellow);margin-top:18px}
</style></head>
<body><div class="frame">
<div class="top label">Lowe Books</div>
<div>
  <h1 class="display">Ask your mom this at Christmas dinner.</h1>
  <div class="card"><div class="label">Then just listen</div><div class="display">How did you know when you were in love with your partner?</div></div>
</div>
<div class="foot"><div class="from">One of 300 questions in</div><div class="title display">300 Questions to Ask Your Parents</div><div class="tag">Get curious. Scroll less.</div></div>
</div>
<script src="anim.js"></script><script>function render(t){}</script></body></html>
